name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version: "24"
          cache: true

      - run: vp install
      - name: Dependency audit
        # Fails on new high-severity advisories. Production-path advisories are
        # never allowlisted here; the documented overrides in pnpm-workspace.yaml
        # are the only escape hatch for transitive runtime dependencies. Dev-only
        # advisories are resolved by toolchain or lockfile updates, or allowlisted
        # only with justification and a tracking issue (docs/development.md).
        run: vp pm audit -- --audit-level high
      - run: vp run validate
