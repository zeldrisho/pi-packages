name: Release

# Releases are driven by the agent: it bumps `package.json`, writes the
# `CHANGELOG.md` entry by hand, and pushes a `<package>-v<version>` tag
# (for example `pi-web-search-v0.5.0`). Pushing that tag creates the GitHub
# release from the changelog and publishes the package to npm.

on:
  push:
    tags:
      - "*-v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: "24"
          cache: true

      - run: vp install

      - name: Resolve package from tag
        id: pkg
        run: echo "result=$(vp exec node scripts/release.ts package '${{ github.ref_name }}')" >> "$GITHUB_OUTPUT"

      - name: Validate package path
        id: path
        run: |
          pkg_path='${{ fromJSON(steps.pkg.outputs.result).path }}'
          case "$pkg_path" in
            packages/*) ;;
            *) echo "Refusing to write release notes for non-package path: $pkg_path" >&2; exit 1 ;;
          esac
          case "$pkg_path" in
            *".."*) echo "Refusing package path with '..' component: $pkg_path" >&2; exit 1 ;;
          esac
          echo "value=$pkg_path" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        run: vp exec node scripts/release.ts notes '${{ steps.path.outputs.value }}' "${{ runner.temp }}/notes.md"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ fromJSON(steps.pkg.outputs.result).shortName }} v${{ fromJSON(steps.pkg.outputs.result).version }}
          body_path: ${{ runner.temp }}/notes.md
          target_commitish: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish package
        working-directory: ${{ steps.path.outputs.value }}
        run: vp pm publish -- --access public
