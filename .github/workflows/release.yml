name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - run: vp install
      - run: vp run validate

  plan:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.status.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - run: vp install
      - id: status
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "matrix=$(vp exec node scripts/release.ts status)" >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    # Only a push that merges the generated release pull request, or a retry of a
    # release whose changelog entry already landed on main but which is not yet
    # tagged, populates the matrix (scripts/release.ts status). Regular feature
    # merges only update the release pull request via the prepare job.
    if: fromJSON(needs.plan.outputs.matrix).include[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: publish
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: false

      - run: vp install
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: vp exec node scripts/release.ts ensure-github-release '${{ matrix.package }}'

      - name: Publish package
        if: matrix.publish
        working-directory: ${{ matrix.package }}
        run: vp pm publish -- --access public

  prepare:
    needs: [plan, release]
    if: >-
      always() && needs.plan.result == 'success' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - run: vp install
      - name: Prepare release changes
        env:
          RELEASE_PR_BODY: ${{ runner.temp }}/git-cliff-release-pr.md
        run: vp exec node scripts/release.ts prepare

      - name: Validate and update release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR_BODY: ${{ runner.temp }}/git-cliff-release-pr.md
        run: |
          if git diff --quiet; then
            exit 0
          fi

          vp run validate
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          branch='git-cliff/release'
          remote_sha=$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)
          if [ -n "$remote_sha" ]; then
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
          fi

          git checkout -B "$branch"
          git add packages/*/package.json packages/*/CHANGELOG.md
          git commit -m 'chore: release packages'
          auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          if [ -n "$remote_sha" ]; then
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth_header" \
              push --force-with-lease="refs/heads/$branch:$remote_sha" origin "$branch"
          else
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth_header" \
              push --set-upstream origin "$branch"
          fi
          unset auth_header

          pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body-file "$RELEASE_PR_BODY"
          else
            gh pr create \
              --base main \
              --head "$branch" \
              --title 'chore: release packages' \
              --body-file "$RELEASE_PR_BODY"
          fi
