name: Release

# Releases are driven by the agent: it bumps `package.json`, writes the
# `CHANGELOG.md` entry by hand, and pushes a `<package>-v<version>` tag
# (for example `pi-web-search-v0.5.0`). Pushing that tag creates the GitHub
# release from the changelog and publishes the package to npm.

on:
  push:
    tags:
      - "*-v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: "24"
          cache: true

      - run: vp install

      - name: Resolve package from tag
        id: pkg
        run: echo "result=$(vp exec node scripts/release.ts package '${{ github.ref_name }}')" >> "$GITHUB_OUTPUT"

      - name: Validate package path
        id: path
        run: |
          pkg_path='${{ fromJSON(steps.pkg.outputs.result).path }}'
          case "$pkg_path" in
            packages/*) ;;
            *) echo "Refusing to write release notes for non-package path: $pkg_path" >&2; exit 1 ;;
          esac
          case "$pkg_path" in
            *".."*) echo "Refusing package path with '..' component: $pkg_path" >&2; exit 1 ;;
          esac
          echo "value=$pkg_path" >> "$GITHUB_OUTPUT"

      - name: Verify release commit is on the default branch
        run: |
          # actions/checkout runs with persist-credentials: false, so the git
          # credential helper has no token and an unauthenticated fetch fails on
          # private repositories. Supply the token explicitly for this single
          # fetch so the guard also works there.
          git fetch 'https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git' '+refs/heads/main:refs/remotes/origin/main' --no-tags
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "Refusing to release: ${{ github.sha }} is not an ancestor of main, so it was not reviewed via a pull request." >&2
            exit 1
          fi

      - name: Write release notes
        run: vp exec node scripts/release.ts notes '${{ steps.path.outputs.value }}' "${{ runner.temp }}/notes.md"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ fromJSON(steps.pkg.outputs.result).shortName }} v${{ fromJSON(steps.pkg.outputs.result).version }}
          body_path: ${{ runner.temp }}/notes.md
          target_commitish: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish package
        working-directory: ${{ steps.path.outputs.value }}
        # The tag checkout leaves HEAD detached, so pnpm's publish-branch git
        # check (master|main) aborts. The custom guard above already verifies the
        # commit is reviewed on main, so skip pnpm's redundant git checks here.
        run: vp pm publish -- --access public --no-git-checks
