name: Release

# Releases are driven by the agent: it bumps `package.json`, writes the
# `CHANGELOG.md` entry by hand, and pushes a `<package>-v<version>` tag
# (for example `pi-web-search-v0.5.0`). Pushing that tag creates the GitHub
# release from the changelog and publishes the package to npm.

on:
  push:
    tags:
      - "*-v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release commit is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          # actions/checkout runs with persist-credentials: false, so the git
          # credential helper has no token and an unauthenticated fetch fails on
          # private repositories. Supply the token explicitly for this single
          # fetch so the guard also works there.
          git fetch 'https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git' "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}" --no-tags
          if ! git merge-base --is-ancestor "$RELEASE_SHA" "origin/${DEFAULT_BRANCH}"; then
            echo "Refusing to release: $RELEASE_SHA is not an ancestor of $DEFAULT_BRANCH, so it was not reviewed via a pull request." >&2
            exit 1
          fi

      - uses: voidzero-dev/setup-vp@24d870228786dc83ae73482406bdd1e7befaec14 # v1.21.0
        with:
          node-version: "24"
          cache: true

      - run: vp install

      - name: Resolve package from tag
        id: pkg
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          result="$(node scripts/release.ts package "$RELEASE_TAG")"
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Validate package path
        id: path
        env:
          PKG_RESULT: ${{ steps.pkg.outputs.result }}
        run: |
          pkg_path="$(node -e 'process.stdout.write(JSON.parse(process.env.PKG_RESULT).path)')"
          case "$pkg_path" in
            packages/*) ;;
            *) echo "Refusing to write release notes for non-package path: $pkg_path" >&2; exit 1 ;;
          esac
          case "$pkg_path" in
            *".."*) echo "Refusing package path with '..' component: $pkg_path" >&2; exit 1 ;;
          esac
          echo "value=$pkg_path" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        run: node scripts/release.ts notes '${{ steps.path.outputs.value }}' "${{ runner.temp }}/notes.md"

      - name: Create or verify GitHub release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_TITLE: ${{ fromJSON(steps.pkg.outputs.result).shortName }} v${{ fromJSON(steps.pkg.outputs.result).version }}
          RELEASE_SHA: ${{ github.sha }}
          NOTES_FILE: ${{ runner.temp }}/notes.md
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if release="$(gh release view "$RELEASE_TAG" --json tagName,targetCommitish,name 2>/dev/null)"; then
            node -e '
              const release = JSON.parse(process.argv[1]);
              const expected = { tagName: process.env.RELEASE_TAG, targetCommitish: process.env.RELEASE_SHA, name: process.env.RELEASE_TITLE };
              for (const [key, value] of Object.entries(expected)) {
                if (release[key] !== value) throw new Error(`Existing release ${key} mismatch: expected ${value}, got ${release[key]}`);
              }
            ' "$release"
            echo "Verified existing release $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TITLE" --notes-file "$NOTES_FILE" --target "$RELEASE_SHA"
          fi

      - name: Check published package version
        id: registry
        working-directory: ${{ steps.path.outputs.value }}
        env:
          PACKAGE_NAME: ${{ fromJSON(steps.pkg.outputs.result).name }}
          PACKAGE_VERSION: ${{ fromJSON(steps.pkg.outputs.result).version }}
        run: |
          encoded_name="$(node -e 'process.stdout.write(encodeURIComponent(process.env.PACKAGE_NAME))')"
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/registry.json" --write-out '%{http_code}' "https://registry.npmjs.org/$encoded_name/$PACKAGE_VERSION")"
          case "$status" in
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            200)
              node -e '
                const pkg = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
                if (pkg.name !== process.env.PACKAGE_NAME || pkg.version !== process.env.PACKAGE_VERSION || !pkg.dist?.integrity) {
                  throw new Error("Registry package metadata does not match the expected package/version");
                }
              ' "$RUNNER_TEMP/registry.json"
              echo "exists=true" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "Unexpected npm registry response: HTTP $status" >&2; exit 1 ;;
          esac

      - name: Publish package
        if: steps.registry.outputs.exists == 'false'
        working-directory: ${{ steps.path.outputs.value }}
        # The tag checkout leaves HEAD detached, so pnpm's publish-branch git
        # check (master|main) aborts. The custom guard above already verifies the
        # commit is reviewed on main, so skip pnpm's redundant git checks here.
        run: vp pm publish -- --access public --no-git-checks --provenance
