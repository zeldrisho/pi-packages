name: Release

# Releases are driven by the agent: it bumps `package.json`, writes the
# `CHANGELOG.md` entry by hand, and pushes a `<package>-v<version>` tag
# (for example `pi-web-search-v0.5.0`). Pushing that tag creates the GitHub
# release from the changelog and publishes the package to npm.

on:
  push:
    tags:
      - "*-v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release commit is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          # actions/checkout runs with persist-credentials: false, so the git
          # credential helper has no token and an unauthenticated fetch fails on
          # private repositories. Supply the token explicitly for this single
          # fetch so the guard also works there.
          git fetch 'https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git' "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}" --no-tags
          if ! git merge-base --is-ancestor "$RELEASE_SHA" "origin/${DEFAULT_BRANCH}"; then
            echo "Refusing to release: $RELEASE_SHA is not an ancestor of $DEFAULT_BRANCH, so it was not reviewed via a pull request." >&2
            exit 1
          fi

      - uses: voidzero-dev/setup-vp@24d870228786dc83ae73482406bdd1e7befaec14 # v1.21.0
        with:
          node-version: "24"
          cache: true

      - run: vp install

      - name: Resolve package from tag
        id: pkg
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          result="$(node scripts/release.ts package "$RELEASE_TAG")"
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Validate package path
        id: path
        env:
          PKG_RESULT: ${{ steps.pkg.outputs.result }}
        run: |
          pkg_path="$(node -e 'process.stdout.write(JSON.parse(process.env.PKG_RESULT).path)')"
          case "$pkg_path" in
            packages/*) ;;
            *) echo "Refusing to write release notes for non-package path: $pkg_path" >&2; exit 1 ;;
          esac
          case "$pkg_path" in
            *".."*) echo "Refusing package path with '..' component: $pkg_path" >&2; exit 1 ;;
          esac
          echo "value=$pkg_path" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        run: node scripts/release.ts notes '${{ steps.path.outputs.value }}' "${{ runner.temp }}/notes.md"

      - name: Create GitHub release
        run: gh release create "$RELEASE_TAG" --verify-tag --title "${{ fromJSON(steps.pkg.outputs.result).shortName }} v${{ fromJSON(steps.pkg.outputs.result).version }}" --notes-file "${{ runner.temp }}/notes.md" --target "${{ github.sha }}"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Publish package
        working-directory: ${{ steps.path.outputs.value }}
        # The tag checkout leaves HEAD detached, so pnpm's publish-branch git
        # check (master|main) aborts. The custom guard above already verifies the
        # commit is reviewed on main, so skip pnpm's redundant git checks here.
        run: vp pm publish -- --access public --no-git-checks --provenance
