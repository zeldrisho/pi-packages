[changelog]
header = "# Changelog\n"
body = """
{% if version %}\
  {% set display_version = version | split(pat="-v") | last %}\
  {% if previous.version %}\
    ## [{{ display_version }}](https://github.com/zeldrisho/pi-packages/compare/{{ previous.version }}...{{ version }}) ({{ timestamp | date(format="%Y-%m-%d") }})
  {% else %}\
    ## {{ display_version }} ({{ timestamp | date(format="%Y-%m-%d") }})
  {% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/zeldrisho/pi-packages/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}\
{% endif %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^revert", group = "Reverts" },
  { message = "^docs?", group = "Documentation" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^test", group = "Tests" },
  { message = "^build", group = "Build system" },
  { message = "^ci", group = "Continuous integration" },
  { message = "^style", skip = true },
  { message = "^chore: release", skip = true },
  { message = "^chore", group = "Maintenance" },
]
protect_breaking_commits = true
filter_commits = true
fail_on_unmatched_commit = true
tag_pattern = "^[A-Za-z0-9._-]+-v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = true
sort_commits = "oldest"

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
initial_tag = "0.0.0"
