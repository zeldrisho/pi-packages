        <h1>FrontierHarness Eval</h1>
        <p>
          FrontierHarness Eval is an open benchmark of AI coding agent harnesses. It runs 21 harness

          software engineering, science, data, systems, ML and security, and compares their pass
          rate, cost and speed.

          scores and tracked separately.
