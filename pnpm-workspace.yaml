packages:
  - "packages/*"

allowBuilds:
  "@google/genai": false
  koffi: false
  protobufjs: false

catalog:
  "@earendil-works/pi-ai": "^0.84.0"
  "@earendil-works/pi-coding-agent": "^0.84.0"
  "@earendil-works/pi-tui": "^0.84.0"
  "@types/node": "^26.1.1"
  "@vitest/coverage-v8": 4.1.10
  typebox: "^1.1.24"
  typescript: "^7.0.0"
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vite-plus: 0.2.9
  vitest: 4.1.10

minimumReleaseAgeExclude:
  - "@earendil-works/pi-agent-core@0.84.0"
  - "@earendil-works/pi-ai@0.84.0"
  - "@earendil-works/pi-client@0.84.0"
  - "@earendil-works/pi-coding-agent@0.84.0"
  - "@earendil-works/pi-protocol@0.84.0"
  - "@earendil-works/pi-telemetry@0.84.0"
  - "@earendil-works/pi-tui@0.84.0"
  # Newly published security fix; remove after the normal release-age window.
  - nanoid@3.3.18
  - "@voidzero-dev/vite-plus-core@0.2.9"
  - "@voidzero-dev/vite-plus-darwin-arm64@0.2.9"
  - "@voidzero-dev/vite-plus-darwin-x64@0.2.9"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@0.2.9"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@0.2.9"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@0.2.9"
  - "@voidzero-dev/vite-plus-linux-x64-musl@0.2.9"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@0.2.9"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@0.2.9"
  - vite-plus@0.2.9

overrides:
  # Dependency-override lifecycle, tracked in issue #37
  # (https://github.com/zeldrisho/pi-packages/issues/37). Re-check the removal
  # condition on every catalog or lockfile bump and drop the override in the
  # same change. scripts/repository-contract-test.ts fails when an overridden
  # package disappears from the dependency graph.
  #
  # Dropped with the 0.84.0 catalog bump: undici (GHSA-4cwx-7wf7-3272,
  # GHSA-8xcm-r25x-g524, GHSA-v3r7-h72x-cjcm, GHSA-jr45-8vmc-qm54,
  # GHSA-m8rv-5g2x-5cg5) was forced to 8.9.0 because pi-coding-agent pinned
  # undici@8.5.0; pi-coding-agent@0.84.0 repins undici@8.9.0, so the override
  # became a no-op. brace-expansion was dropped earlier with the 0.83.0 bump.
  vite: "catalog:"
  vitest: "catalog:"
  # Dev-only advisory GHSA-2v37-7h3g-55p8: nanoid custom generators loop
  # indefinitely on size zero. Transitively pulled by postcss via the Vite+
  # toolchain; forced to the patched release. Override lifecycle tracked in
  # issue #37.
  "nanoid@^3.3.17": "3.3.18"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
