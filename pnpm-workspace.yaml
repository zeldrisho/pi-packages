packages:
  - "packages/*"

# Delay newly published dependencies long enough for ecosystem review and block
# less trustworthy resolution paths or provenance downgrades.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
blockExoticSubdeps: true

allowBuilds:
  "@google/genai": false
  esbuild: true
  koffi: false
  protobufjs: false

catalog:
  "@earendil-works/pi-ai": "^1.4.0"
  "@earendil-works/pi-coding-agent": "^1.4.0"
  "@earendil-works/pi-tui": "^1.4.0"
  # Keep Node types aligned with the current LTS major used in CI.
  "@types/node": "^26.6.6"
  "@vitest/coverage-v8": 5.1.0
  typebox: "^1.4.3"
  typescript: "^7.0.2"
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0
  vitest: 5.1.0

overrides:
  # Dependency-override lifecycle, tracked in issue #37
  # (https://github.com/zeldrisho/pi-packages/issues/37). Re-check the removal
  # condition on every catalog or lockfile bump and drop the override in the
  # same change. tests/repository-contract.test.ts fails when an overridden
  # package disappears from the dependency graph.
  vite@*: "catalog:"
  vitest@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
