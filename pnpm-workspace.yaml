packages:
  - "packages/*"

# Delay newly published dependencies long enough for ecosystem review and block
# less trustworthy resolution paths or provenance downgrades.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
blockExoticSubdeps: true

allowBuilds:
  "@google/genai": false
  koffi: false
  protobufjs: false

catalog:
  "@earendil-works/pi-ai": "^0.84.2"
  "@earendil-works/pi-coding-agent": "^0.84.2"
  "@earendil-works/pi-tui": "^0.84.2"
  "@types/node": "^26.2.0"
  "@vitest/coverage-v8": 4.1.11
  typebox: "^1.3.16"
  typescript: "^7.0.2"
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0
  vitest: 4.1.11

minimumReleaseAgeExclude:
  # Vite+ 0.3.0 published 2026-08-24 and nanoid@3.3.18 published 2026-08-07
  # (per `npm view <pkg> time`). Re-audit on every catalog bump: drop each
  # entry once its version is older than the configured minimumReleaseAge
  # window, and drop entries for versions that no longer appear in the
  # lockfile. (The 0.84.0 pi toolchain exclusions were dropped with the
  # 0.84.2 catalog bump on 2026-08-21.)
  # Security fix for nanoid (see override comment below); same audit rule as
  # the toolchain entries.
  - nanoid@3.3.18
  - "@voidzero-dev/vite-plus-core@0.3.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@0.3.0"
  - "@voidzero-dev/vite-plus-darwin-x64@0.3.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@0.3.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@0.3.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@0.3.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@0.3.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@0.3.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@0.3.0"
  - vite-plus@0.3.0

overrides:
  # Dependency-override lifecycle, tracked in issue #37
  # (https://github.com/zeldrisho/pi-packages/issues/37). Re-check the removal
  # condition on every catalog or lockfile bump and drop the override in the
  # same change. tests/repository-contract.test.ts fails when an overridden
  # package disappears from the dependency graph.
  #
  # Dropped with the 0.84.0 catalog bump: undici (GHSA-4cwx-7wf7-3272,
  # GHSA-8xcm-r25x-g524, GHSA-v3r7-h72x-cjcm, GHSA-jr45-8vmc-qm54,
  # GHSA-m8rv-5g2x-5cg5) was forced to 8.9.0 because pi-coding-agent pinned
  # undici@8.5.0; pi-coding-agent@0.84.0 repins undici@8.9.0, so the override
  # became a no-op. brace-expansion was dropped earlier with the 0.83.0 bump.
  vite: "catalog:"
  vitest: "catalog:"
  # Dev-only advisory GHSA-2v37-7h3g-55p8: nanoid custom generators loop
  # indefinitely on size zero. Transitively pulled by postcss via the Vite+
  # toolchain; forced to the patched release. Override lifecycle tracked in
  # issue #37. Removal condition: drop this override in the same change that
  # bumps vite-plus past the release that pins postcss with nanoid >= 3.3.18
  # (verify with `grep nanoid pnpm-lock.yaml`); nanoid@3.3.18 was published
  # 2026-08-07, so also re-check its `minimumReleaseAgeExclude` entry at each
  # catalog bump.
  "nanoid@^3.3.17": "3.3.18"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
