packages:
  - "packages/*"

# Delay newly published dependencies long enough for ecosystem review and block
# less trustworthy resolution paths or provenance downgrades.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
blockExoticSubdeps: true

allowBuilds:
  "@google/genai": false
  esbuild: true
  koffi: false
  protobufjs: false

catalog:
  "@earendil-works/pi-ai": "^1.3.0"
  "@earendil-works/pi-coding-agent": "^1.3.0"
  "@earendil-works/pi-tui": "^1.3.0"
  # Node types track the supported runtime floor (engines.node), not the newest
  # release, so APIs unavailable on Node 24 fail type checking.
  "@types/node": "^24.19.2"
  "@vitest/coverage-v8": 5.0.5
  typebox: "^1.4.2"
  typescript: "^7.0.2"
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  vitest: 5.0.5

minimumReleaseAgeExclude:
  # Reviewed releases published within the seven-day minimum-age window as of
  # 2026-10-20. Remove entries after they age past the window.
  - "@earendil-works/pi-ai@1.3.0"
  - "@earendil-works/pi-coding-agent@1.3.0"
  - "@earendil-works/pi-tui@1.3.0"
  - "@earendil-works/pi-agent-core@1.3.0"
  - "@earendil-works/pi-codemode@1.3.0"
  - "@earendil-works/pi-mcp@1.3.0"
  - "@earendil-works/pi-telemetry@1.3.0"
  - "@vitest/browser-preview@5.0.5"
  - "@vitest/browser@5.0.5"
  - "@vitest/coverage-v8@5.0.5"
  - "@vitest/mocker@5.0.5"
  - "@vitest/pretty-format@5.0.5"
  - "@vitest/snapshot@5.0.5"
  - "@vitest/spy@5.0.5"
  - "@vitest/utils@5.0.5"
  - "@vitest/ui@5.0.5"
  - "vitest@5.0.5"
  - "@voidzero-dev/vite-plus-core@1.3.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.3.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.3.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.3.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.3.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.3.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.3.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.3.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.3.0"
  - "typebox@1.4.2"
  - "vite-plus@1.3.0"
overrides:
  # Dependency-override lifecycle, tracked in issue #37
  # (https://github.com/zeldrisho/pi-packages/issues/37). Re-check the removal
  # condition on every catalog or lockfile bump and drop the override in the
  # same change. tests/repository-contract.test.ts fails when an overridden
  # package disappears from the dependency graph.
  # Dropped with the 0.84.0 catalog bump: undici (GHSA-4cwx-7wf7-3272,
  # GHSA-8xcm-r25x-g524, GHSA-v3r7-h72x-cjcm, GHSA-jr45-8vmc-qm54,
  # GHSA-m8rv-5g2x-5cg5) was forced to 8.9.0 because pi-coding-agent pinned
  # undici@8.5.0; pi-coding-agent@0.84.0 repins undici@8.9.0, so the override
  # became a no-op. brace-expansion was dropped earlier with the 0.83.0 bump.
  vite@*: "catalog:"
  vitest@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
