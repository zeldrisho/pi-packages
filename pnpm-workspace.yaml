packages:
  - "packages/*"

# Delay newly published dependencies long enough for ecosystem review and block
# less trustworthy resolution paths or provenance downgrades.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
blockExoticSubdeps: true

allowBuilds:
  "@google/genai": false
  esbuild: true
  koffi: false
  protobufjs: false

catalog:
  "@earendil-works/pi-ai": "^0.99.1"
  "@earendil-works/pi-coding-agent": "^0.99.1"
  "@earendil-works/pi-tui": "^0.99.1"
  "@types/node": "^26.5.1"
  "@vitest/coverage-v8": 5.0.1
  typebox: "^1.3.30"
  typescript: "^7.0.2"
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  vitest: 5.0.1

minimumReleaseAgeExclude:
  # Exact-version exemptions still within the 7-day release-age window as of
  # 2026-09-30. Recheck timestamps after every migration/catalog update;
  # remove entries once their versions age past the window.
  - "@earendil-works/pi-ai@0.99.1"
  - "@earendil-works/pi-coding-agent@0.99.1"
  - "@earendil-works/pi-tui@0.99.1"
  - "@earendil-works/chord@0.99.1"
  - "@earendil-works/pi-agent-core@0.99.1"
  - "@earendil-works/pi-codemode@0.99.1"
  - "@earendil-works/pi-mcp@0.99.1"
  - "@earendil-works/pi-telemetry@0.99.1"
  - "@oxlint-tsgolint/darwin-arm64@7.0.2003"
  - "@oxlint-tsgolint/darwin-x64@7.0.2003"
  - "@oxlint-tsgolint/linux-arm64@7.0.2003"
  - "@oxlint-tsgolint/linux-x64@7.0.2003"
  - "@oxlint-tsgolint/win32-arm64@7.0.2003"
  - "@oxlint-tsgolint/win32-x64@7.0.2003"
  - "@vitest/istanbul-lib-coverage@1.0.2"
  - "@vitest/istanbul-lib-report@1.0.2"
  - "@voidzero-dev/vite-plus-core@1.0.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.0.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.0.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.0.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.0.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.0.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.0.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.0.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.0.0"
  - "oxlint-tsgolint@7.0.2003"
  - "vite-plus@1.0.0"

overrides:
  # Dependency-override lifecycle, tracked in issue #37
  # (https://github.com/zeldrisho/pi-packages/issues/37). Re-check the removal
  # condition on every catalog or lockfile bump and drop the override in the
  # same change. tests/repository-contract.test.ts fails when an overridden
  # package disappears from the dependency graph.
  #
  # Dropped with the 0.84.0 catalog bump: undici (GHSA-4cwx-7wf7-3272,
  # GHSA-8xcm-r25x-g524, GHSA-v3r7-h72x-cjcm, GHSA-jr45-8vmc-qm54,
  # GHSA-m8rv-5g2x-5cg5) was forced to 8.9.0 because pi-coding-agent pinned
  # undici@8.5.0; pi-coding-agent@0.84.0 repins undici@8.9.0, so the override
  # became a no-op. brace-expansion was dropped earlier with the 0.83.0 bump.
  vite@*: "catalog:"
  vitest@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
