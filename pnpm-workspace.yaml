packages:
  - "packages/*"

# Delay newly published dependencies long enough for ecosystem review and block
# less trustworthy resolution paths or provenance downgrades.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
trustPolicyExclude:
  # pnpm ranks the staged tsrs bootstrap above subsequent OIDC releases.
  # Recheck on the next Vite+ upgrade: https://github.com/oxc-project/tsrs/issues/945
  - tsrs@7.1.0-beta.tsrs2
blockExoticSubdeps: true

minimumReleaseAgeExclude:
  # Reviewed migration pins. Remove after 2026-11-30 10:01 UTC.
  - "@cloudflare/oxlint-config@0.2.0"
  - "@nkzw/oxlint-config@4.1.0"
  - "@nkzw/eslint-plugin@3.0.0"

allowBuilds:
  "@google/genai": false
  esbuild: true
  koffi: false
  protobufjs: false

catalog:
  "@earendil-works/pi-ai": "^1.6.0"
  "@earendil-works/pi-coding-agent": "^1.6.0"
  "@earendil-works/pi-tui": "^1.6.0"
  # Keep Node types aligned with the current LTS major used in CI.
  "@types/node": "^26.6.6"
  typebox: "^1.4.7"
  typescript: "^7.0.2"
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
  vitest: 5.1.0

overrides:
  # Dependency-override lifecycle, tracked in issue #37
  # (https://github.com/zeldrisho/pi-packages/issues/37). Re-check the removal
  # condition on every catalog or lockfile bump and drop the override in the
  # same change. tests/repository-contract.test.ts fails when an overridden
  # package disappears from the dependency graph.
  vite@*: "catalog:"
  vitest@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
